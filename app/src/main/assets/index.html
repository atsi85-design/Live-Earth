<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Interactive Earth Globe</title>
<style>
  html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#000; }
  #globe { width:100%; height:100%; touch-action:none; }
  .hint {
    position:fixed; left:50%; bottom:18px; transform:translateX(-50%);
    color:white; background:rgba(0,0,0,.55); padding:9px 14px;
    border-radius:20px; font:14px system-ui,sans-serif; pointer-events:none;
    white-space:nowrap;
  }
</style>
</head>
<body>
<div id="globe"></div>
<div class="hint">Drag to spin • Pinch to zoom • Double-tap to zoom</div>
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.160.0/examples/js/controls/OrbitControls.js"></script>
<script>
const container = document.getElementById('globe');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 0, 3.2);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
container.appendChild(renderer.domElement);

const loader = new THREE.TextureLoader();
const earthTexture = loader.load(
  'https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg'
);
const bumpTexture = loader.load(
  'https://threejs.org/examples/textures/planets/earth_normal_2048.jpg'
);
const specTexture = loader.load(
  'https://threejs.org/examples/textures/planets/earth_specular_2048.jpg'
);

const earth = new THREE.Mesh(
  new THREE.SphereGeometry(1, 128, 128),
  new THREE.MeshPhongMaterial({
    map: earthTexture,
    normalMap: bumpTexture,
    specularMap: specTexture,
    specular: new THREE.Color(0x333333),
    shininess: 12
  })
);
scene.add(earth);

const atmosphere = new THREE.Mesh(
  new THREE.SphereGeometry(1.025, 96, 96),
  new THREE.MeshBasicMaterial({
    color:0x4da6ff, transparent:true, opacity:.10,
    side:THREE.BackSide
  })
);
scene.add(atmosphere);

scene.add(new THREE.AmbientLight(0x404040, 1.2));
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(4, 2, 5);
scene.add(sun);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = .055;
controls.enablePan = false;
controls.minDistance = 1.35;
controls.maxDistance = 8;
controls.rotateSpeed = .55;
controls.zoomSpeed = .8;

function resize() {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
}
addEventListener('resize', resize);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
